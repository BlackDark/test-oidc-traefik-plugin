name: Run Go tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "website/**"

permissions: {}

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        working-directory: ./src
        run: go get .

      - name: Build
        working-directory: ./src
        run: go build

      - name: Test with the Go CLI
        working-directory: ./src
        run: go test

      - name: Build extauth-server
        working-directory: ./cmd/extauth-server
        run: go build

      - name: Test extauth-server
        working-directory: ./cmd/extauth-server
        run: go test
