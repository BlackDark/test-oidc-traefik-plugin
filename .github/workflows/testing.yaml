name: Run Go tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "website/**"

permissions: {}

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        working-directory: ./src
        run: go get .

      - name: Build
        working-directory: ./src
        run: go build

      - name: Test with the Go CLI
        working-directory: ./src
        run: go test

      - name: Build extauth-server
        working-directory: ./cmd/extauth-server
        run: go build

      - name: Test extauth-server
        working-directory: ./cmd/extauth-server
        run: go test
