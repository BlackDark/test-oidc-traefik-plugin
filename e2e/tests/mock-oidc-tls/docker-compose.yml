services:
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:5.0.2
    ports:
      - "8443:8443"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./login.html:/app/login.html:ro
      - "./certificates:/certificates:ro"
    environment:
      SERVER_PORT: "8443"
      JSON_CONFIG_PATH: /app/config.json
      LOG_LEVEL: info
    healthcheck:
      # --no-check-certificate is load-bearing, not defensive: the mock now
      # serves HTTPS with the throwaway leaf from gencerts.sh, so the default
      # verifier rejects it and the container would never be reported healthy.
      # Health is "the TLS listener answers", which is exactly what the plugin
      # needs to be true; whether the plugin trusts the certificate is what the
      # tests are about.
      test:
        ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://127.0.0.1:8443/isalive"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  traefik:
    image: traefik:v3.5.0
    # Deliberately different from the mock-oidc stack's 9080/9443/8080 so the
    # two suites can be up at the same time on one runner (and so this suite can
    # be run locally without stopping the main one).
    ports:
      - "9180:80"
      - "9543:443"
      - "8180:8080"
    extra_hosts:
      # The plugin dials the provider from inside this container. `localhost`
      # there is the container itself, so it is remapped onto the docker bridge
      # gateway where the host-published 8443 lands. Without these, every
      # discovery call would connect to the container's own loopback.
      - "localhost:172.17.0.1"
      - "127-0-0-1.sslip.io:172.17.0.1"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "../../../workspaces/configs/traefik-config.yml:/etc/traefik/traefik.yml:ro"
      - "../../..:/plugins-local/src/github.com/BlackDark/test-oidc-traefik-plugin:ro"
      # .http-tls.yml, not .http.yml: configureTraefik stamps a per-write
      # CookieNamePrefix and both suites share one Traefik config file name by
      # default, so a fixed shared name would let each stack's tests overwrite
      # the other's config mid-run.
      - "../../.http-tls.yml:/etc/traefik/configs/http.yml:ro"
      - "./certificates:/certificates:ro"
      - "./data:/data:ro"
    environment:
      # Both names are set to the HTTPS endpoint. PROVIDER_URL is not "also keep
      # the http one": the mock no longer listens on plain HTTP at all, so an
      # http value here would be a broken default for any config that forgot to
      # pick PROVIDER_URL_HTTPS.
      PROVIDER_URL: https://localhost:8443/default
      PROVIDER_URL_HTTPS: https://localhost:8443/default
      CLIENT_ID: traefik
      CLIENT_SECRET: test-secret
      TOA_ENABLE_REDIRECT_URI_WILDCARDS: "true"
    depends_on:
      mock-oauth2-server:
        condition: service_healthy

  whoami:
    # Pinned like its siblings: whoami has no v3.x line to match traefik:v3.5.0,
    # so pin its newest 1.x release instead of the floating :latest.
    image: traefik/whoami:v1.12.0